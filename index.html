<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e14;
    --surface: #11161d;
    --surface-2: #161c25;
    --border: #1f2730;
    --border-strong: #2a3442;
    --text: #c5d1de;
    --text-dim: #7a8896;
    --accent: #00ff00;
    --accent-dim: #00b800;
    --accent-glow: rgba(0, 255, 0, 0.15);
  }
  body {

    min-height: 100vh;
    padding: 2rem 1rem;
    background-image:

  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 2rem;
    position: relative;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
  .header .prompt {
    font-size: 14px; color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .status-text {
    font-size: 12px; color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.5px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
    50% { opacity: 0.4; box-shadow: 0 0 2px var(--accent); }
  }

  .terminal {
    background: #05080c;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border-strong);
  }
  .terminal-dots { display: flex; gap: 6px; margin-bottom: 12px; }
  .terminal-dot { width: 11px; height: 11px; border-radius: 50%; }
  .term-output {
    color: var(--text); line-height: 1.7;
    min-height: 150px;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .term-output::-webkit-scrollbar { width: 6px; }
  .term-output::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .term-output .cmd { color: var(--accent); }
  .term-output .muted { color: var(--text-dim); }
  .term-output .err { color: #ff5f56; }
  .term-output .dir { color: #4dabf7; font-weight: 500; }
  .term-output .file { color: var(--text); }
  .term-output .hidden-file { color: var(--text-dim); }
  .term-cursor {
    display: inline-block; width: 8px; height: 14px;
    background: var(--accent);
    vertical-align: middle; margin-left: 2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .term-buttons { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .cmd-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cmd-btn:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* Modo interactivo */
  .term-input-line {
    display: none;
    margin-top: 8px;

    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;

  .term-prompt-text {
    color: var(--accent);
    margin-right: 6px;
    white-space: nowrap;

  .term-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: inherit;

  .stats-grid {

    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));

  .stat-card {

  .stat-label {
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;

  .stat-value {

  .skills-section { margin-bottom: 1.5rem; }

  .action-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;

  .action-btn:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);

  /* Botón glitch oculto */
  .glitch-btn {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border: none;
    padding: 0;
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  .glitch-btn:hover {
    opacity: 1;
    transform: scale(1.5);
    box-shadow: 0 0 4px var(--accent);
  }

  @media (max-width: 600px) {
    .container { padding: 1.25rem; }
    body { padding: 1rem 0.5rem; }
    .header h1 { font-size: 20px; }
  }

  ::selection { background: var(--accent); color: var(--bg); }
</style>

/* ============================================================
   ESTADO Y UTILIDADES
   ============================================================ */

let cwd = ['home', 'visitor'];     // current working directory como array de segmentos
let cmdHistory = [];
let historyIdx = 0;
let interactiveMode = false;

const out = document.getElementById('term-output');
const buttonsBar = document.getElementById('term-buttons');
const inputLine = document.getElementById('term-input-line');
const inputEl = document.getElementById('term-input');
const promptEl = document.getElementById('term-prompt');

function pathStr(arr) {
  if (arr.length === 0) return '/';
  return '/' + arr.join('/');
}

function prettyPath(arr) {
  // /home/visitor → ~ ; /home/visitor/skills → ~/skills
  const home = ['home', 'visitor'];
  if (arr.length >= 2 && arr[0] === home[0] && arr[1] === home[1]) {
    const rest = arr.slice(2);
    return rest.length ? '~/' + rest.join('/') : '~';
  }
  return pathStr(arr);
}

function getNode(pathArr) {
  let node = FS;
  for (const seg of pathArr) {
    if (node.type !== 'dir' || !node.children || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}

function resolvePath(input) {
  // Devuelve un array de segmentos a partir del input
  if (!input || input === '~') return ['home', 'visitor'];
  let segments;
  if (input.startsWith('/')) {
    segments = input.split('/').filter(Boolean);
  } else if (input.startsWith('~/')) {
    segments = ['home', 'visitor', ...input.slice(2).split('/').filter(Boolean)];
  } else {
    segments = [...cwd, ...input.split('/').filter(Boolean)];
  }
  // Resolver .. y .
  const stack = [];
  for (const s of segments) {
    if (s === '.') continue;
    if (s === '..') stack.pop();
    else stack.push(s);
  }
  return stack;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function appendOutput(html) {
  out.innerHTML += html;
  out.scrollTop = out.scrollHeight;
}

/* ============================================================
   COMANDOS
   ============================================================ */

const commands = {
  help() {
    return `<div class="muted">Comandos disponibles:</div>
  <span class="cmd">help</span>          muestra esta ayuda
  <span class="cmd">ls [-a] [path]</span>  lista archivos (-a incluye ocultos)
  <span class="cmd">cd &lt;path&gt;</span>     cambia de directorio
  <span class="cmd">pwd</span>           muestra ruta actual
  <span class="cmd">cat &lt;file&gt;</span>    muestra contenido de un archivo
  <span class="cmd">tree</span>          muestra árbol de directorios
  <span class="cmd">whoami</span>        información del usuario
  <span class="cmd">clear</span>         limpia la pantalla
  <span class="cmd">exit</span>          vuelve al modo botones`;
  },

  ls(args) {
    const showHidden = args.includes('-a');
    const target = args.find(a => !a.startsWith('-')) || '.';
    const pathArr = resolvePath(target);
    const node = getNode(pathArr);
    if (!node) return `<span class="err">ls: no existe el directorio: ${escapeHtml(target)}</span>`;
    if (node.type === 'file') return `<span class="file">${escapeHtml(target)}</span>`;
    const entries = Object.entries(node.children)
      .filter(([n, child]) => showHidden || !child.hidden)
      .map(([n, child]) => {
        if (child.type === 'dir') return `<span class="dir">${n}/</span>`;
        return `<span class="${child.hidden ? 'hidden-file' : 'file'}">${n}</span>`;
      });
    return entries.join('  ') || '<span class="muted">(vacío)</span>';
  },

  cd(args) {
    const target = args[0] || '~';
    const pathArr = resolvePath(target);
    const node = getNode(pathArr);
    if (!node) return `<span class="err">cd: no existe: ${escapeHtml(target)}</span>`;
    if (node.type !== 'dir') return `<span class="err">cd: no es un directorio: ${escapeHtml(target)}</span>`;
    cwd = pathArr;
    updatePrompt();
    return '';
  },

  pwd() {
    return pathStr(cwd);
  },

  cat(args) {
    if (!args[0]) return '<span class="err">cat: falta el nombre del archivo</span>';
    const pathArr = resolvePath(args[0]);
    const node = getNode(pathArr);
    if (!node) return `<span class="err">cat: no existe: ${escapeHtml(args[0])}</span>`;
    if (node.type === 'dir') return `<span class="err">cat: ${escapeHtml(args[0])}: es un directorio</span>`;
    return escapeHtml(node.content);
  },

  tree() {
    function walk(node, prefix = '', isLast = true) {
      let result = '';
      const children = Object.entries(node.children || {}).filter(([_, c]) => !c.hidden);
      children.forEach(([name, child], i) => {
        const last = i === children.length - 1;
        const connector = last ? '└── ' : '├── ';
        const display = child.type === 'dir'
          ? `<span class="dir">${name}/</span>`
          : `<span class="file">${name}</span>`;
        result += prefix + connector + display + '\n';
        if (child.type === 'dir') {
          result += walk(child, prefix + (last ? '    ' : '│   '), last);
        }
      });
      return result;
    }
    const startNode = getNode(cwd);
    return `<span class="dir">${prettyPath(cwd)}</span>\n` + walk(startNode);
  },

  whoami() {
    return 'visitor — explorador curioso';
  },

  clear() {
    out.innerHTML = '';
    return null;
  },

  exit() {
    exitInteractive();
    return null;
  }
};

/* ============================================================
   PROCESAR INPUT
   ============================================================ */

function updatePrompt() {
  promptEl.textContent = `visitor@portfolio:${prettyPath(cwd)}$`;
}

function runCommand(line) {
  const trimmed = line.trim();
  if (!trimmed) return;

  // Echo del comando
  appendOutput(`<div><span class="cmd">${escapeHtml(promptEl.textContent)}</span> ${escapeHtml(trimmed)}</div>`);

  // Logging opcional
  logCommand(trimmed);

  // Parsear
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0];
  const args = parts.slice(1);

  if (commands[cmd]) {
    const result = commands[cmd](args);
    if (result !== null && result !== '') {
      appendOutput(`<div>${result}</div>`);
    }
  } else {
    appendOutput(`<div class="err">${escapeHtml(cmd)}: comando no encontrado. Prueba "help".</div>`);
  }
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const value = inputEl.value;
    if (value.trim()) {
      cmdHistory.push(value);
      historyIdx = cmdHistory.length;
    }
    inputEl.value = '';
    runCommand(value);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      inputEl.value = cmdHistory[historyIdx] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx < cmdHistory.length - 1) {
      historyIdx++;
      inputEl.value = cmdHistory[historyIdx] || '';
    } else {
      historyIdx = cmdHistory.length;
      inputEl.value = '';
    }
  }
});

<div class="muted">// Aviso: los comandos pueden ser registrados con fines analíticos.</div>
<div></div>`;
  updatePrompt();
  setTimeout(() => inputEl.focus(), 100);
}

function exitInteractive() {
  interactiveMode = false;
  inputLine.classList.remove('active');
  buttonsBar.style.display = 'flex';
  out.innerHTML = `<div class="cmd">$ welcome --user visitor</div>
<div>Bienvenido. Ejecuta un comando para explorar mi perfil.</div>
<div class="muted">Comandos disponibles: whoami, skills, experience, contact<span class="term-cursor"></span></div>`;
}

document.getElementById('glitch-btn').addEventListener('click', enterInteractive);

/* ============================================================
   LOGGING (Discord webhook)
   ============================================================ */

function logCommand(cmd) {
  if (!WEBHOOK_URL) return;
  try {
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content: `\`${cmd}\` · ${navigator.language || '?'} · ${new Date().toISOString()}`
      })
    }).catch(() => {});
  } catch (e) {}
}

const responses = {

document.querySelectorAll('.cmd-btn').forEach(btn => {

    const cmd = btn.dataset.cmd;
    if (cmd === 'clear') {
      out.innerHTML = '<div class="cmd">$ clear</div><div class="muted">Terminal limpio. Prueba otro comando.<span class="term-cursor"></span></div>';
    } else {
      out.innerHTML = responses[cmd];
    }
  });
});

/* ============================================================
   ANIMACIONES INICIALES (skills + counters)
   ============================================================ */
function animateCount(id, target) {
  const el = document.getElementById(id);
  let current = 0;
  const step = Math.max(1, Math.round(target / 30));
  const timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(timer); }
    el.textContent = current;
  }, 40);
}
setTimeout(() => {
  animateCount('Cursos', 5);
  animateCount('Certificados Profesionales', 2);
  animateCount('Idiomas', 2); 
  }, 300);
